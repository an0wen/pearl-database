unique_id = "dorogokupets2015"

[science]
material = "magnesium metasilicate"
formula = "MgSiO3"
phase = "post-perovskite"
physical_state = "solid"
method = "experimental compilation and simultaneous thermodynamic/P-V-T optimization"

[description]
type = "fit"
cold_type = "Kunc exponential cold EOS with k=5"
thermal_exist = true
thermal_type = "two-Einstein Mie-Gruneisen"
reference_temperature = 298.15

[parameters]
U_0 = -1447900
V_0 = 2.42e-05
K_0 = 253700000000
K_0_prime = 4.03
k = 5
theta_01 = 943
m_1 = 7.5
theta_02 = 417
m_2 = 7.5
gamma_0 = 1.67
beta = 2.22
gamma_inf = 0

[parameter_status]
U_0 = "reported fitted/calibrated value, Table 1; converted from kJ/mol to J/mol"
V_0 = "reported value, Table 1; converted from cm^3/mol to m^3/mol"
K_0 = "reported optimized value, Table 1; converted from GPa to Pa"
K_0_prime = "reported optimized value, Table 1"
k = "fixed by authors at 5 for molecular compounds"
theta_01 = "reported fitted characteristic temperature, Table 1"
m_1 = "reported oscillator multiplicity, Table 1"
theta_02 = "reported fitted characteristic temperature, Table 1"
m_2 = "reported oscillator multiplicity, Table 1"
gamma_0 = "reported fitted value, Table 1"
beta = "reported fitted value, Table 1"
gamma_inf = "reported fitted value, Table 1"

[equations]
cold_pressure = "P0(V) = 3*K_0*X^(-k)*(1-X)*exp(eta*(1-X)); X=(V/V_0)^(1/3); eta=1.5*K_0_prime-k+0.5"
thermal_free_energy = "Fth = m_1*R*T*ln(1-exp(-theta_1/T)) + m_2*R*T*ln(1-exp(-theta_2/T))"
theta_volume = "theta = theta_0*x^(-gamma_inf)*exp((gamma_0-gamma_inf)/beta*(1-x^beta)); x=V/V_0"
gamma_volume = "gamma = gamma_inf + (gamma_0-gamma_inf)*x^beta"

[provenance]
source_location = "Table 1, p. 175; thermodynamic model equations 1-19, pp. 173-175"
notes = "Authors simultaneously optimized heat capacity, thermal expansion, adiabatic bulk modulus, and P-V-T measurements. Pressure data from several source studies were recalculated onto the authors' internally consistent pressure scales."

[other]
notes = "This entry preserves both Einstein characteristic temperatures and multiplicities. Magrathea retains only a reduced subset of these parameters for its implementation; PEARL stores the full Table 1 source parameterization."
