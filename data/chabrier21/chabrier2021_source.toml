notes = "2021 interaction-corrected H/He EOS. Built from an effective hydrogen EOS plus the 2019 helium EOS and constrained by Militzer & Hubbard (2013) QMD H/He simulations at Y≈0.245. The source explicitly cautions that the effective-H table is only an intermediate component for constructing mixtures and must not be used as a standalone pure-H EOS."
