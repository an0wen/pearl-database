unique_id = "li2023"

[science]
material = "silicon dioxide"
formula = "SiO2"
physical_state = "solid"
phase = "seifertite"
crystal = "PbO2-type"
space_group = "Pbcn"
method = ["DFT", "quasi-harmonic approximation", "generalized rescaling"]

[description]
type = "analytical"
cold_type = "bm3"
thermal_exist = true
thermal_type = "debye"
reference_temperature = 300.0
n_atoms_per_formula = 3
equation_source = "Equations 13-21 and Table 1, pp. 5-6"
equations = [
  "P(V,T) = P_T0(V) + P_th(V,T)",
  "P_T0(V) = BM3(V; V_0, K_0, K_0_prime)",
  "P_th(V,T) = 3*n*R*T*gamma(V)*D(theta(V)/T)/V",
  "gamma(V) = gamma_0*(V/V_0)^q",
  "theta(V) = theta_0*exp((gamma_0-gamma(V))/q)",
  "F(V,T) = F_T0(V) + F_th(V,T)",
]

[setup]
summary = "VASP 5.4.4 PAW/PBE-GGA calculations with Phonopy quasi-harmonic lattice dynamics; generalized rescaling was applied before final P-V-T-F regression."
phase_specific = "LD supercell 3x3x3."

[source_data]
raw_file = "li2023_sio2_thermo_raw.xlsx"
sheet = "TVPF"
row_range = "52-71"
data_status = "reported supplementary regression data"

[validity]
range_type = "calibration-data range calculated from the phase-specific rows of the supplementary TVPF sheet; not an author-recommended extrapolation range"
min_p = 7.11345895321879e+10
max_p = 1.94669979449421e+11
min_t = 3e+2
max_t = 4e+3
min_v = 9.9932e-6
max_v = 1.21454e-5
min_rho = 4.94708e+3
max_rho = 6.01252e+3
density_status = "derived from V using adopted molar mass 0.0600843 kg/mol"

[parameters]
V_0 = 1.373e-5
dV_0 = 1e-8
K_0 = 3.31e+11
dK_0 = 3e+9
K_0_prime = 3.82e+0
dK_0_prime = 2e-2
gamma_0 = 1.2e+0
dgamma_0 = 1e-2
q = 8e-1
dq = 4e-2
theta_0 = 1.084e+3
dtheta_0 = 1e+0
E_0 = -8.008e+5
dE_0 = 3e+2

