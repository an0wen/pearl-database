unique_id = "grande2022"

[science]
material = "water"
formula = "H2O"
phase = "ice-VII*"
physical_state = "solid"
crystal = "tetragonal"
space_group = "P-42m"
method = "diamond-anvil-cell synchrotron powder XRD; Le Bail volume extraction; Au pressure marker"

[dataset]
type = "experimental P-V"
source_location = "Supplementary Information, Table 4, pp. 19-24"
raw_file = "grande2022_table4_thermo_raw.dat"
standardized_file = "grande2022_iceviit_thermo.dat"
conversion_script = "grande2022_table4_thermo.py"
row_count = 83
row_selection = "5.1 GPa < P <= 30.9 GPa using nominal final-paper phase boundaries"
phase_assignment_status = "derived from the authors' preferred final-paper nominal phase boundaries"
temperature_column_included = false
column_order = ["rho[kg/m^3]", "P[Pa]", "dP[Pa]", "V[m^3/mol]"]
temperature_condition = "room temperature; nominally approximately 300 K, but no row-resolved temperatures are reported in Table 4"

[validity]
min_p = 5260000000
max_p = 30430000000
min_rho = 1716.61179889
max_rho = 2408.06773049
min_V = 7.48121814511e-06
max_V = 1.04946732928e-05
range_type = "calculated extrema of the phase-selected Supplementary Table 4 rows"

[columns.rho]
header = "rho[kg/m^3]"
unit = "kg/m^3"
status = "derived"
conversion = "rho = molar_mass / V_molar"

[columns.P]
header = "P[Pa]"
unit = "Pa"
status = "reported, converted"
source_column = "Pressure (GPa)"
conversion = "P_Pa = P_GPa * 1e9"

[columns.dP]
header = "dP[Pa]"
unit = "Pa"
status = "reported uncertainty, converted"
source_column = "Error (GPa)"
conversion = "dP_Pa = dP_GPa * 1e9"
notes = "The Supplementary Information states that these pressure uncertainties are based on average deviations among Au pressure estimates and are used to give more weight to points with less deviatoric stress."

[columns.V]
header = "V[m^3/mol]"
unit = "m^3/mol"
status = "converted"
source_column = "Volume (A^3)"
conversion = "V_molar = V_cell_A3 * 1e-30 * N_A / Z"

[conversion_provenance]
N_A = 6.02214076e23
Z = 2
Z_status = "reported/supported crystallographic cell content: Supplementary Information states two molecules per cubic ice-VII and ice-X unit cell; the mapped primitive VIIt cell contains two H2O formula units"
molar_mass = 18.01528e-3
molar_mass_unit = "kg/mol"

[other]
notes = "Table 4 states that all ice volumes were indexed by Le Bail extraction assuming a bcc Pn-3m cell. The standardized molar volume therefore uses Z=2 for the indexed cell. Temperature is intentionally metadata-only rather than a repeated 300 K column because the source does not tabulate a temperature for each pressure-volume measurement."
