crystal = "rock salt"
physical_state = "solid"
method = "laser-heated DAC synchrotron XRD"

[description]
type = "fit"
cold_type = "bm3"
thermal_exist = true
thermal_type = "Holland-Powell thermal pressure"
reference_temperature = 300.0

[validity]
range_type = "Data Set S1 sheet SiC_B1_EoS, labeled data points used for EoS refinement"
min_p = 64500000000
max_p = 205010000000
min_t = 300
max_t = 3332.25
min_rho = 4518.94286501417
max_rho = 5793.42827386579

[parameters]
V_0 = 9.9214769021e-06
dV_0 = 6.02214076e-09
K_0 = 339e9
dK_0 = 2e9
K_0_prime = 3.03
dK_0_prime = 0.02
T_0 = 300.0
theta_E = 967.2
theta_E_status = "fixed; deterministic correction from the authors stated theta_E = 0.806*theta_D with theta_D = 1200 K; Table 2 prints 976.2 K"
alpha_V = 5.8e-6
dalpha_V = 0.1e-6
alpha_V_status = "fitted; selected 0.58(0.01)*10^-5 K^-1 because the main-text fit description and Supporting Fig. S6 independently agree; Table 2 prints 0.56(0.01)*10^-5 K^-1 and is treated as a table typo"

[conversion]
cell_formula_units = 4
cell_formula_units_status = "crystallographic conversion for conventional cubic rock-salt SiC cell"
molar_mass = 0.040096
molar_mass_status = "kg/mol; value used by supplied MAGRATHEA SiC implementation"

[implementation.magrathea]
status = "implementation differs from the preferred author planetary-model formulation"
notes = "Supplied MAGRATHEA code substitutes a Vinet cold curve 'for better high-pressure extrapolation' and uses the source MGD-style thermal parameters: V0=9.90 cm^3/mol (consistent with the 65.8 Angstrom^3 MGD Table 2 reference volume after rounding), K0=339 GPa, K0'=3.06, theta_D=1200 K, gamma0=0.50, q/beta=1.67."

[other]
notes = "Table 2 TP model is retained because Supporting Text S3 states that the planetary SiC mantle calculations use the third-order Birch-Murnaghan EOS and Holland-Powell thermal-pressure model. The source also reports an MGD fit: V0=65.8(0.04) Angstrom^3/cell, K0=339(10) GPa, K0'=3.06(0.06), theta_D=1200 K fixed, gamma0=0.50(0.05), q=1.67(0.5), chi^2=2.46. Resolved source inconsistencies: alpha_V=0.58(0.01)*10^-5 K^-1 is selected because it appears independently in the main-text fit description and Supporting Fig. S6; the 0.56 value in Table 2 is treated as a table typo. theta_E=967.2 K is used as the deterministic value from the authors stated relation theta_E=0.806*theta_D with theta_D=1200 K; Table 2 prints 976.2 K."
