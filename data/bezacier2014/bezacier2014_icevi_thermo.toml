unique_id = "bezacier2014"

[science]
material = "water"
formula = "H2O"
phase = "ice-VI"
crystal = "tetragonal"
physical_state = "solid"
space_group = "P4_2/nmc"
type = "experiment"
method = "externally heated DAC synchrotron powder XRD"
setup = "Polycrystalline H2O in an externally heated diamond-anvil cell; ruby R1 fluorescence pressure gauge; K-type thermocouple; in situ synchrotron powder XRD at ESRF ID09A; Le Bail lattice refinement with EXPGUI-GSAS; EOS fits with EOSFit 5.2."

[validity]
min_p = 1.26e9
max_p = 2.81e9
min_t = 298.7
max_t = 340.7
min_v = 1.22116e-5
max_v = 1.31249e-5
min_rho = 1372.6
max_rho = 1475.26
range_type = "curator-calculated extrema of the 45 ice VI rows in Table I; this is the source-data/calibration range, not an author-recommended extrapolation range"

[provenance]
source_location = "Table I, PDF pages 3-4 (article pages 104505-2 to 104505-3), ice VI section"
raw_file = "bezacier2014_icevi_table1_thermo_raw.dat"
standardized_file = "bezacier2014_icevi_thermo.dat"
conversion_script = "bezacier2014_icevi_thermo.py"
transcription_status = "manually transcribed from the PDF text layer and checked against the rendered Table I"
row_count = 45
column_order = ["rho[kg/m^3]", "drho[kg/m^3]", "P[Pa]", "dP[Pa]", "T[K]", "dT[K]", "V[m^3/mol]", "dV[m^3/mol]"]

[conversion]
unit_cell_Z = 10
unit_cell_Z_status = "inferred"
unit_cell_Z_note = "The paper reports unit-cell volumes and the phase space group but does not explicitly state Z in Table I. Z=10 is retained as an inferred crystallographic conversion factor because it is required to convert unit-cell volume to molar volume; the resulting molar-volume scale is consistent with the reported PVT EOS V_0."
avogadro_constant = 6.02214076e23
avogadro_constant_status = "exact SI"
molar_volume_equation = "V_m = V_cell[A^3] * 1e-30 * N_A / Z"
molar_mass = 18.01528e-3
molar_mass_unit = "kg/mol"
molar_mass_status = "adopted for deterministic density conversion"
density_equation = "rho = M_H2O / V_m"
density_uncertainty_equation = "drho = rho * dV / V; propagated from reported volume uncertainty only"

[[columns]]
name = "rho"
header = "rho[kg/m^3]"
unit = "kg/m^3"
status = "derived"
description = "Density calculated from the standardized molar volume."
provenance = "rho = M_H2O / V using adopted M_H2O = 18.01528e-3 kg/mol."

[[columns]]
name = "drho"
header = "drho[kg/m^3]"
unit = "kg/m^3"
status = "derived uncertainty"
description = "First-order density uncertainty propagated from the reported unit-cell-volume uncertainty only."
provenance = "drho = rho * dV / V; molar-mass uncertainty is not included."

[[columns]]
name = "P"
header = "P[Pa]"
unit = "Pa"
status = "converted"
source_column = "P (GPa)"
conversion = "P[Pa] = P[GPa] * 1e9"

[[columns]]
name = "dP"
header = "dP[Pa]"
unit = "Pa"
status = "converted"
source_column = "parenthetical uncertainty on P (GPa)"
conversion = "dP[Pa] = dP[GPa] * 1e9"

[[columns]]
name = "T"
header = "T[K]"
unit = "K"
status = "reported"
source_column = "T (K)"

[[columns]]
name = "dT"
header = "dT[K]"
unit = "K"
status = "reported"
source_location = "Table I caption"
description = "The table caption gives a common temperature error of +/-0.4 K for all rows."

[[columns]]
name = "V"
header = "V[m^3/mol]"
unit = "m^3/mol"
status = "converted"
source_column = "V (A^3)"
description = "Molar volume converted from reported unit-cell volume."

[[columns]]
name = "dV"
header = "dV[m^3/mol]"
unit = "m^3/mol"
status = "converted"
source_column = "parenthetical uncertainty on V (A^3)"
description = "Uncertainty converted by the same exact scale factor as V."
[other]
notes = "The reported lattice parameters are preserved in the raw transcription but are not duplicated in the standardized thermodynamic table. Density and density uncertainty are derived for PEARL standardization; the source itself reports unit-cell volume rather than density."
