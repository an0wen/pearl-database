unique_id = "bezacier2014"

[science]
material = "water"
formula = "H2O"
phase = "ice-VI"
crystal = "tetragonal"
physical_state = "solid"
space_group = "P4_2/nmc"
method = "externally heated DAC synchrotron powder XRD"

[description]
type = "fit"
cold_type = "bm2"
thermal_exist = true
thermal_type = "BM2 with constant volumetric thermal expansion and linear K(T)"
reference_temperature = 300.0
reference_pressure = 1.0e5
source_location = "Equations (1)-(3), Table II, and Results/Discussion on PDF pages 5-6 (article pages 104505-4 to 104505-5)"
notes = "Primary parameters below are the authors' PVT fit. K_0_prime is fixed at 4 by the second-order Birch-Murnaghan formalism. (dK/dT)_P is explicitly set to zero by the authors because no temperature dependence was noticeable."

[equations]
cold = "P = (3/2) K_0 * ((V_0/V)^(7/3) - (V_0/V)^(5/3))"
thermal_volume = "V(P,T) = V(P,T_0) * exp(alpha_0 * (T - T_0))"
bulk_modulus_temperature = "K(T) = K_0 + (T - T_0) * (dK/dT)_P"

[validity]
min_p = 1.26e9
max_p = 2.81e9
min_t = 298.7
max_t = 340.7
min_v = 1.22116e-5
max_v = 1.31249e-5
range_type = "curator-calculated extrema of this phase in Table I; interpreted as the experimental data/calibration range of the PVT fit"
extrapolation_range = "not reported"

[parameters]
V_0 = 14.17e-6
dV_0 = 0.02e-6
K_0 = 14.05e9
dK_0 = 0.23e9
K_0_prime = 4.0
alpha_0 = 14.6e-5
dalpha_0 = 1.4e-5
dK_dT_P = 0.0
T_0 = 300.0
P_0 = 1.0e5

[parameter_status]
V_0 = "fitted and reported; converted from cm^3/mol to m^3/mol"
dV_0 = "reported parenthetical fit uncertainty; converted from cm^3/mol to m^3/mol"
K_0 = "fitted and reported; converted from GPa to Pa"
dK_0 = "reported parenthetical fit uncertainty; converted from GPa to Pa"
K_0_prime = "fixed at 4 for BM2"
alpha_0 = "fitted and reported; converted from the tabulated x10^-5 K^-1 notation to K^-1"
dalpha_0 = "reported parenthetical fit uncertainty; converted to K^-1"
dK_dT_P = "fixed by authors at 0 because no temperature dependence was noticeable"
T_0 = "reported reference temperature"
P_0 = "reported ambient reference pressure"

[other]
notes = "The PVT EOS provides P-V-T/elastic behavior through thermal expansion but does not provide a complete caloric EOS (no reported u, s, c_v, c_p formulation for this fit)."
