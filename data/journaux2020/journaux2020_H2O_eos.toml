unique_id = "journaux2020"

[science]
material = "water"
formula = "H2O"
phase = ["ice-Ih", "ice-II", "ice-III", "ice-V", "ice-VI", "liquid"]
method = "Gibbs local-basis-function representations distributed as the SeaFreeze software package"

[description]
type = "code"
thermal_exist = true
representation = "Gibbs energy local basis functions (sixth-order tensor B-splines)"

[validity]
range_type = "aggregate publication scope for SeaFreeze v0.9.2; individual phase representations have phase-specific domains"
max_p = 2.3e9
min_t = 130.0
max_t = 500.0

[software]
name = "SeaFreeze"
repository = "https://github.com/Bjournaux/SeaFreeze/tree/master"
archive_doi = "https://doi.org/10.5281/zenodo.3367730"
published_version = "0.9.2"
languages = ["Python", "MATLAB"]
source_location = "Section 3.2.6 and Data Availability Statement"
notes = "All results in Journaux et al. 2020 were computed with released SeaFreeze version 0.9.2. The GitHub master repository is the continuing software project and may contain later phases, solutes, expanded ranges, interface changes, and bug fixes that are outside the 2020 publication."

[outputs]
thermodynamic = ["G", "rho", "Cp", "Cv", "S", "U", "H", "Kt", "Ks", "alpha", "chemical_potential"]
elastic = ["shear_modulus", "Vp", "Vs"]
phase_equilibrium = true

[provenance]
ice_Ih = "LBF conversion of Feistel & Wagner 2006 representation"
ice_II = "Journaux et al. 2020 Gibbs representation"
ice_III = "Journaux et al. 2020 Gibbs representation"
ice_V = "Journaux et al. 2020 Gibbs representation"
ice_VI = "Journaux et al. 2020 Gibbs representation"
liquid = "Bollengier et al. 2019 Gibbs LBF water representation"

[other]
notes = "This is a PEARL code-type EOS entry. It intentionally stores software identity, provenance, publication-version information, and scope rather than copying the internal spline coefficients. The current SeaFreeze repository should be used to obtain the executable implementation. Ice VII/X and aqueous NaCl representations presently in the live repository are later additions and are not attributed to Journaux et al. 2020."
