notes = "Primary author-reported Vinet fit retained: V_0 fixed to the ambient atomic volume while K_0 and K_0_prime are fitted freely. This is not a calibrated thermal EOS or a strictly measured 300 K isotherm. Fe-7Si is observed in the hcp structure over the measured ramp-compression range."

[equations]
