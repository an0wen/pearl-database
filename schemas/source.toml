unit = "—"
required = false
example = ""

[fields."github.author"]
type = "string"
description = "Username of the github repository."
unit = "—"
required = false
example = ""

[fields."authorsource.official_directory"]
type = "string"
description = "Author provided link to source of ressource."
unit = "—"
required = false
example = ""

[fields."authorsource.official_archive"]
type = "string"
description = "Author provided link to ressource."
unit = "—"
required = false
example = ""

[fields."authorsource.table_release"]
type = "string"
